name: FreeBSD
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_freebsd:
    runs-on: ubuntu-22.04
    name: A job to run FreeBSD
    env:
      MYTOKEN : ${{ secrets.MYTOKEN }}
      MYTOKEN2: "value2"
    steps:
    - uses: actions/checkout@v4
    - name: VM FreeBSD
      id: freebsd_id
      uses: vmactions/freebsd-vm@v1
      with:
        envs: 'MYTOKEN MYTOKEN2'
        usesh: true
        prepare: |
          pkg install -y cmake git pkgconf sqlite3 gtk3

        run: |
          git clone --depth 1 https://github.com/frang75/nappgui_src.git
          cd nappgui_src
          cmake -S . -B build -DNAPPGUI_DEMO=NO -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          cmake --install build --config Release --prefix /usr/local/nappgui
          cd ..
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local/nappgui
          cmake --build build
          cp build/Release/bin/naptimer build/Release/bin/naptimer_freebsd || cp build/Release/bin/naptimer naptimer_freebsd

    - name: Upload freeBSD Binary to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: 'build/Release/bin/naptimer_freebsd'
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
