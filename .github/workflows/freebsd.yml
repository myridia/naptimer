name: FreeBSD
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_freebsd:
    runs-on: ubuntu-22.04
    name: FreeBSD (unsupported)

    steps:
      - name: Skip
        run: |
          echo "NAppGUI 1.7 does not support FreeBSD."
          echo "NAppCompilers.cmake rejects CMAKE_SYSTEM_NAME=FreeBSD with 'Unknown Platform'."
          echo "Skipping the FreeBSD build until NAppGUI adds upstream FreeBSD support."
