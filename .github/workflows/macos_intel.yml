name: Macos_intel
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  Build:
    runs-on: macos-15-intel

    steps:
       - name: Nappgui
         run: |
          git clone --depth 1 https://github.com/frang75/nappgui_src.git
          cd nappgui_src
          cmake --version
          cmake -G Xcode -S . -B build -DNAPPGUI_DEMO=NO -DCMAKE_OSX_DEPLOYMENT_TARGET=13.6 -DDEPLOYMENT_TARGET_OSX=13.6
          cmake --build build --config Release -j 4
          sudo cmake --install build --config Release --prefix /usr/local/nappgui

       - name: Checkout
         uses: actions/checkout@v4

       - name: Build
         run: |
           cmake -G Xcode -S . -B build -DCMAKE_INSTALL_PREFIX=/usr/local/nappgui -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.6 -DDEPLOYMENT_TARGET_OSX=13.6
           cmake --build build --config Release
           ls build/Release/bin/
           ls build/Release/bin/naptimer.app
           cd build/Release/bin/
           hdiutil create -volname "naptimer" -srcfolder "naptimer.app" -ov -format UDZO "naptimer-macos_intel.dmg"

       - name: Release
         uses: svenstaro/upload-release-action@v2
         with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'build/Release/bin/naptimer-macos_intel.dmg'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
